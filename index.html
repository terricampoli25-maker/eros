<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Eros - Love Poetry Oracle</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
</head>
<body>
  <div class="app-container">
    <img src="background.png" alt="Eros - Love Poetry Oracle" class="therapist-img" />
    <div class="speech-bubble" id="speechBubble">
      <button class="bubble-close" id="bubbleClose">✕</button>
      <p id="bubbleText">Love speaks thus...</p>
    </div>
    <div class="therapist-name">
      <h1>Eros</h1>
      <p>hello world<br><small>(From <a href="https://www.youtube.com/@TestingWithTerri" target="_blank">Terri's Apps</a>)</small></p>
    </div>
    <div class="input-panel">
      <div class="input-row">
        <textarea id="userInput" placeholder="Speak your heart..." rows="1"></textarea>
        <button id="sendBtn">Send</button>
      </div>
      <p class="disclaimer">Share your heart, receive poetry.</p>
    </div>
  </div>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('Service Worker registered'))
        .catch(err => console.log('Service Worker error:', err));
    }
  </script>
</body>
</html>
