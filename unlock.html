<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eros — Unlock</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #2a1420; color: #f0ede4; font-family: Georgia, 'Times New Roman', serif; }
    #unlock-wrap { text-align: center; padding: 24px; max-width: 420px; width: 100%; }
    h1 { font-weight: normal; letter-spacing: 1px; margin-bottom: 8px; }
    #unlock-box { background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.15);
                  border-radius: 10px; padding: 24px; }
    #unlock-lead { margin-top: 0; }
    input { width: 100%; box-sizing: border-box; padding: 12px; font-size: 16px; border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.9); color: #222;
            font-family: monospace; letter-spacing: 1px; text-align: center; }
    button { margin-top: 12px; width: 100%; padding: 12px; font-size: 16px; border: none; border-radius: 6px;
             background: #a04a6a; color: #fff; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: default; }
    #unlock-error { color: #ffb3a7; min-height: 1.2em; }
    #unlock-note { font-size: 14px; color: #c9c4b8; }
    a { color: #e8a8c0; }
  </style>
</head>
<body>

<div id="unlock-wrap">
  <h1>Eros</h1>
  <div id="unlock-box">
    <p id="unlock-lead">Enter the serial number from your purchase email.</p>
    <form id="unlock-form">
      <input type="text" id="unlock-serial" placeholder="EROS-XXXX-XXXX-XXXX" autocomplete="off" spellcheck="false" maxlength="64">
      <button type="submit" id="unlock-btn">Unlock</button>
    </form>
    <p id="unlock-error"></p>
    <p id="unlock-note">Your serial works on 1 device.<br>
      No serial yet? <a id="unlock-buy" href="https://terristech.com">Find it at terristech.com</a></p>
  </div>
</div>

<script src="unlock.js"></script>
</body>
</html>
